[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "pdd-aftersales-rpa"
version = "0.1.0"
description = "Windows-first multi-shop after-sales RPA with rule routing, approvals, idempotency and audit trails"
readme = "README.md"
requires-python = ">=3.13"
license = { text = "LicenseRef-AllRightsReserved" }
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.34,<1",
  "pywinauto>=0.6.9,<1",
  "pywin32>=308",
  "Pillow>=11,<13",
  "httpx2>=2,<3",
  "playwright>=1.62,<2"
]

[tool.setuptools]
packages = ["pdd_rpa", "pdd_rpa.connectors"]
include-package-data = true

[tool.setuptools.package-data]
pdd_rpa = ["static/*"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
